apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-slo
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  slo-overview.json: |
    {
      "title": "SLO overview",
      "uid": "slo-overview",
      "timezone": "browser",
      "refresh": "1m",
      "time": { "from": "now-7d", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "service",
            "type": "query",
            "datasource": "Prometheus",
            "query": "label_values(slo:error_budget:remaining_ratio, service)",
            "includeAll": true,
            "multi": true
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Error budget remaining",
          "gridPos": { "h": 6, "w": 8, "x": 0, "y": 0 },
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "min": 0,
              "max": 1,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "orange", "value": 0.25 },
                  { "color": "green", "value": 0.5 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "slo:error_budget:remaining_ratio{service=~\"$service\"}",
              "legendFormat": "{{service}} / {{slo}}"
            }
          ]
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Burn rate vs page threshold (1h window)",
          "description": "Above the dashed line the month's budget is being spent in about two days.",
          "gridPos": { "h": 6, "w": 16, "x": 8, "y": 0 },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [
            {
              "expr": "slo:sli_error:ratio_rate1h{service=~\"$service\"}",
              "legendFormat": "{{service}} / {{slo}}"
            },
            {
              "expr": "14.4 * (1 - slo:objective:ratio{service=~\"$service\"})",
              "legendFormat": "page threshold {{service}}"
            }
          ]
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Error ratio by window",
          "description": "Short windows react fast and are noisy, long ones are steady and slow. Alerts require both.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 6 },
          "fieldConfig": { "defaults": { "unit": "percentunit" } },
          "targets": [
            { "expr": "slo:sli_error:ratio_rate5m{service=~\"$service\"}", "legendFormat": "5m {{slo}}" },
            { "expr": "slo:sli_error:ratio_rate1h{service=~\"$service\"}", "legendFormat": "1h {{slo}}" },
            { "expr": "slo:sli_error:ratio_rate6h{service=~\"$service\"}", "legendFormat": "6h {{slo}}" },
            { "expr": "slo:sli_error:ratio_rate3d{service=~\"$service\"}", "legendFormat": "3d {{slo}}" }
          ]
        }
      ]
    }
